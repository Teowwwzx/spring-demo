version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: pixel-arena-redis
    ports:
      - "6380:6379"  # Map container port 6379 to host port 6380
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
